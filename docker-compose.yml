services:
  postgres:
    image: postgres:16-alpine
    container_name: us_accidents_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-de_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_password}
      POSTGRES_DB: ${POSTGRES_DB:-us_accidents}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de_user} -d ${POSTGRES_DB:-us_accidents}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
